name: install

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "agent/**"
      - "tools/**"
      - "docs/zh_cn/releases/**"
  pull_request:
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "agent/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  install:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate resources and rules
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npx @nekosu/maa-tools check
          if ($LASTEXITCODE -ne 0) { throw 'Resource check failed' }
          python -m pip install -r tools/gui-requirements.txt jsonschema==4.26.0 referencing==0.37.0
          if ($LASTEXITCODE -ne 0) { throw 'Python dependencies failed' }
          python tools/validate_schema.py --schema-dir deps/tools --resource-dirs assets/resource --exclude-dirs assets/resource/announcement --interface-files assets/interface.json
          if ($LASTEXITCODE -ne 0) { throw 'Schema check failed' }
          python -X utf8 -m unittest discover -s tools -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed' }

      - name: Build and smoke test
        shell: pwsh
        run: ./tools/build_gui.ps1 -Python python -Output build/package

      - name: Create release archive
        shell: pwsh
        env:
          BUILD_REF: ${{ github.ref }}
          BUILD_REF_NAME: ${{ github.ref_name }}
        run: |
          $version = 'v' + (Get-Content assets/interface.json -Raw | ConvertFrom-Json).version.TrimStart('v')
          if ($env:BUILD_REF.StartsWith('refs/tags/')) { $version = $env:BUILD_REF_NAME }
          python -X utf8 tools/create_release.py --package build/package --output build/artifacts --version $version
          if ($LASTEXITCODE -ne 0) { throw 'Release archive failed' }

      - uses: actions/upload-artifact@v4
        with:
          name: MAAEden-win-x64
          path: build/artifacts/*
          compression-level: 0
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MAAEden-win-x64
          path: build/artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: MAAEden ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: docs/zh_cn/releases/${{ github.ref_name }}.md
          files: |
            build/artifacts/*.zip
            build/artifacts/*.sha256
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
